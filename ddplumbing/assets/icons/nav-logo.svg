<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 207 40" width="207" height="40" role="img" aria-labelledby="title">
  <title id="title">D &amp; D Plumbing logo</title>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123E68"/>
      <stop offset="1" stop-color="#061D38"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#168BE0"/>
      <stop offset="1" stop-color="#07579C"/>
    </linearGradient>
  </defs>

  <!-- Compact D & D mark, matching the requested 207 x 40 canvas -->
  <g transform="translate(2,2)">
    <!-- Wrench -->
    <path d="M10 7.5c-3.2-3.8-2.9-7.5.6-9.2 2.2-1.1 4.7-.8 6.4.6l-3.1 3.1 3.1 3.1 3.2-3.1c1.2 2.1.9 4.8-.7 6.5-2.4 2.5-6.4 2.4-8.5.4L7 12.4l-3.1-3.1z"
          fill="#AEB8C2" stroke="#F4F7FA" stroke-width="1.2" transform="translate(17,2) scale(.62)"/>
    <path d="M31 6.5l13 12" stroke="#0B2F52" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M31 6.5l13 12" stroke="#168BE0" stroke-width="3.6" stroke-linecap="round"/>

    <!-- D -->
    <path d="M0 9v27h13.7C23 36 28.7 31 28.7 22.5S23 9 13.7 9H0zm6.8 5.8h6c5 0 8.3 2.8 8.3 7.7s-3.3 7.7-8.3 7.7h-6z"
          fill="url(#navy)" stroke="#F4F7FA" stroke-width=".85"/>
    <!-- Droplet -->
    <path d="M13.2 14.5s-5.2 6.3-5.2 9.8c0 3.8 2.3 6 5.2 6s5.2-2.2 5.2-6c0-3.5-5.2-9.8-5.2-9.8z"
          fill="url(#blue)" stroke="#F4F7FA" stroke-width=".8"/>

    <!-- Ampersand -->
    <text x="36.5" y="30.5" text-anchor="middle"
          font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800"
          fill="#F4F7FA" stroke="#0B2F52" stroke-width=".7">&amp;</text>

    <!-- Second D -->
    <path d="M45 9v27h13.7c9.3 0 15-5 15-13.5S68 9 58.7 9H45zm6.8 5.8h6c5 0 8.3 2.8 8.3 7.7s-3.3 7.7-8.3 7.7h-6z"
          fill="url(#navy)" stroke="#F4F7FA" stroke-width=".85"/>

    <!-- Small Columbus skyline accent -->
    <path d="M80 36V25h3v-5h3v16m1 0V15h4v21m1 0V22h4v14m1 0V19h4v17m1 0V25h4v11"
          fill="#0B2F52" stroke="#168BE0" stroke-width=".55"/>
    <path d="M78 35q10-5 25 0" fill="none" stroke="#168BE0" stroke-width="1"/>

    <!-- Wordmark -->
    <text x="111" y="25.5" font-family="Arial,Helvetica,sans-serif" font-size="14.5"
          font-weight="900" letter-spacing="1.5" fill="#0B2F52">D&amp;D</text>
    <text x="111" y="34.5" font-family="Arial,Helvetica,sans-serif" font-size="5.2"
          font-weight="700" letter-spacing="1.35" fill="#667789">PLUMBING</text>
  </g>
</svg>