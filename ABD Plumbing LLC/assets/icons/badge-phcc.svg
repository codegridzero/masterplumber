<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2a4a"/>
      <stop offset="100%" stop-color="#011627"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
  </defs>
  <!-- Outer Octagon Shield -->
  <polygon points="60,5 140,5 195,60 195,140 140,195 60,195 5,140 5,60" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="6"/>
  <polygon points="65,13 135,13 187,65 187,135 135,187 65,187 13,135 13,65" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="4,2"/>
  
  <!-- Text Ring -->
  <path id="textArcTop" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <textPath href="#textArcTop" startOffset="50%">PLUMBING - HEATING - COOLING</textPath>
  </text>

  <!-- Center Shield -->
  <circle cx="100" cy="100" r="48" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="100" cy="100" r="44" fill="none" stroke="#0e2a4a" stroke-width="1"/>
  
  <!-- Pipe Wrench Icon in Center -->
  <g transform="translate(100, 90) scale(1.1)">
    <path d="M-12,-12 L12,12 M-8,-15 L-18,-5 L-10,3 L0,-7 Z" fill="none" stroke="#0e2a4a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M12,-12 L-12,12 M8,-15 L18,-5 L10,3 L0,-7 Z" fill="none" stroke="#0e2a4a" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="7" fill="#d4af37" stroke="#0e2a4a" stroke-width="1.5"/>
  </g>
  
  <!-- Text Bottom -->
  <text x="100" y="130" font-family="Arial, sans-serif" font-size="8.5" font-weight="900" fill="#0e2a4a" text-anchor="middle" letter-spacing="1">PHCC MEMBER</text>
  
  <path id="textArcBottom" d="M 35,100 A 65,65 0 0,0 165,100" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#d4af37" text-anchor="middle">
    <textPath href="#textArcBottom" startOffset="50%">CONTRACTORS ASSOCIATION</textPath>
  </text>
</svg>
