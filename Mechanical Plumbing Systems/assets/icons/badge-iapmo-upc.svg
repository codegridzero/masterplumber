<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#001a33"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6ca65"/>
      <stop offset="50%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
  </defs>

  <!-- Outer Double Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#shieldBg)" stroke="url(#goldBorder)" stroke-width="6"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#e6ca65" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="100" cy="100" r="66" fill="#ffffff" stroke="url(#goldBorder)" stroke-width="3"/>

  <!-- Stars on Outer Band -->
  <g fill="#e6ca65">
    <path d="M 22 100 L 25 93 L 32 93 L 26 89 L 29 82 L 22 86 L 15 82 L 18 89 L 12 93 L 19 93 Z" transform="scale(0.5) translate(22, 100)"/>
    <path d="M 378 100 L 381 93 L 388 93 L 382 89 L 385 82 L 378 86 L 371 82 L 374 89 L 368 93 L 375 93 Z" transform="scale(0.5) translate(378, 100)"/>
  </g>

  <!-- Text Top Curved -->
  <path id="iapmoArcTop" d="M 22,100 A 78,78 0 0,1 178,100" fill="none"/>
  <text font-family="'Arial Black', Arial, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    <textPath href="#iapmoArcTop" startOffset="50%">IAPMO R&amp;T LISTED</textPath>
  </text>

  <!-- Text Bottom Curved -->
  <path id="iapmoArcBottom" d="M 22,100 A 78,78 0 0,0 178,100" fill="none"/>
  <text font-family="'Arial Black', Arial, sans-serif" font-size="10" font-weight="900" fill="#e6ca65" text-anchor="middle" letter-spacing="1">
    <textPath href="#iapmoArcBottom" startOffset="50%">UNIFORM PLUMBING CODE</textPath>
  </text>

  <!-- Central Shield & UPC Monogram -->
  <g transform="translate(100, 95)">
    <!-- Shield Outline -->
    <path d="M-30,-30 L30,-30 L30,0 C30,25 0,38 0,38 C0,38 -30,25 -30,0 Z" fill="#003366" stroke="url(#goldBorder)" stroke-width="2.5"/>
    <text x="0" y="-8" font-family="'Arial Black', Arial, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">UPC</text>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#e6ca65" text-anchor="middle" letter-spacing="0.5">CERTIFIED</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#ffffff" text-anchor="middle">COMPLIANT</text>
  </g>
</svg>
